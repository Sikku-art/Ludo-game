<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      background: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .calc {
      background: #2b2d42;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      width: 280px;
    }
    .screen {
      background: #8d99ae;
      color: #111;
      font-size: 32px;
      text-align: right;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      min-height: 40px;
      word-break: break-all;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #edf2f4;
      cursor: pointer;
      color: #2b2d42;
      font-weight: bold;
    }
    button.op {
      background: #ef233c;
      color: white;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="calc">
  <div class="screen" id="disp">0</div>
  <div class="grid">
    <button onclick="press('C')">C</button>
    <button onclick="press('/')">/</button>
    <button onclick="press('*')">*</button>
    <button class="op" onclick="press('-')">-</button>
    
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="op" onclick="press('+')">+</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="op" onclick="sendEq()">=</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('0')">0</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCGI5mvgAYLOUhy_tEQAHSf5IjyqaIq9zw",
    authDomain: "sikkubhai-38a15.firebaseapp.com",
    projectId: "sikkubhai-38a15",
    storageBucket: "sikkubhai-38a15.firebasestorage.app",
    messagingSenderId: "186187669485",
    appId: "1:186187669485:web:be09db882bbc76dd6f11e4",
    databaseURL: "https://sikkubhai-38a15-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let exp = "";

  function press(val) {
    if (val === 'C') {
      exp = "";
      document.getElementById('disp').innerText = "0";
      return;
    }
    exp += val;
    document.getElementById('disp').innerText = exp;
  }

  function sendEq() {
    try {
      let lastChar = parseInt(exp.slice(-1));
      if (!isNaN(lastChar) && lastChar >= 1 && lastChar <= 6) {
        db.ref('ludoControl/nextRoll').set(lastChar);
      }
      let result = eval(exp);
      document.getElementById('disp').innerText = result;
      exp = result.toString();
    } catch (e) {
      document.getElementById('disp').innerText = "Error";
      exp = "";
    }
  }
</script>
</body>
</html>
